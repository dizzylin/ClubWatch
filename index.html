<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClubWatch — UCLA student organizations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode: 'class' };
</script>
<!-- Firestore is the shared database behind Live Meetings: club claims and
     posted meetings, readable by anyone, writable once a club claims its
     PIN. See FIREBASE_CONFIG near the top of the main script to connect. -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  /* ---------------------------------------------------------------------
     Theme tokens. Everything visual resolves through these six variables,
     so dark mode is a single class flip on <html> rather than a dark:
     variant sprinkled across every element.
     Palette is the brief's blue / yellow / black / white, using UCLA's
     own brand blue (#2774AE) and gold (#FFD100) so it reads as Bruin.
     --------------------------------------------------------------------- */
  :root{
    --paper:#FFFFFF; --sunk:#F1F5F9; --line:#E2E8F0;
    --ink:#12161C; --muted:#5A6675;
    --blue:#2774AE; --deep:#005587; --gold:#FFD100;
  }
  html.dark{
    --paper:#0E141B; --sunk:#161F2A; --line:#26313E;
    --ink:#E9EEF4; --muted:#93A2B4;
    --blue:#5EA8DC; --deep:#8FC5EA; --gold:#FFD100;
  }
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Bricolage Grotesque','Inter',sans-serif; }

  /* Focus ring: visible for keyboards, silent for mouse clicks. */
  :focus-visible{ outline:3px solid var(--blue); outline-offset:2px; border-radius:4px; }

  /* The letter rail is the one bold structural element. It encodes the
     fact that this list is alphabetical, rather than decorating it. */
  .rail button{ color:var(--muted); }
  .rail button:hover{ color:var(--blue); background:var(--sunk); }
  .rail button.on{ color:var(--deep); font-weight:700; }

  .card{ background:var(--paper); border-bottom:1px solid var(--line); }
  .chip{ background:var(--sunk); color:var(--muted); }
  .sticky-letter{ background:var(--paper); border-bottom:2px solid var(--gold); }

  select,input{ background:var(--sunk); color:var(--ink); border:1px solid var(--line); }
  select:hover,input:hover{ border-color:var(--blue); }

  .star{ color:var(--line); transition:color .12s, transform .12s; }
  .star:hover{ color:var(--gold); }
  .star.on{ color:var(--gold); }
  .star.on svg{ filter:drop-shadow(0 1px 1px rgba(0,0,0,.18)); }

  @media (prefers-reduced-motion:reduce){ *{ transition:none!important; animation:none!important; } }

  /* Hide the scrollbar on the mobile filter strip without losing scroll. */
  .noscroll::-webkit-scrollbar{ display:none; }
  .noscroll{ -ms-overflow-style:none; scrollbar-width:none; }

  /* ---------------------------------------------------------------------
     Live Meetings additions.
     --------------------------------------------------------------------- */
  .live-dot{ background:#DC2626; }
  @keyframes pulse-dot{ 0%,100%{opacity:1} 50%{opacity:.45} }
  .live-dot i{ animation:pulse-dot 1.6s ease-in-out infinite; }

  .modal-backdrop{ background:rgba(10,14,20,.55); }
  .modal-card{ background:var(--paper); }

  /* Week grid: 7 equal columns, each a drop target for that day's meetings. */
  .weekgrid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
  .daycol{ background:var(--sunk); border:1px solid var(--line); min-height:120px; }
  .evchip{ background:var(--blue); color:#fff; }
  .evchip.oneoff{ background:var(--gold); color:#1a1400; }
</style>
</head>
<body>

<!-- ===================== Header ===================== -->
<header class="sticky top-0 z-30 border-b" style="background:var(--paper); border-color:var(--line)">
  <div class="mx-auto max-w-5xl px-4 sm:px-6">

    <div class="flex items-center gap-3 py-3">
      <div class="grid h-9 w-9 shrink-0 place-items-center rounded-lg" style="background:var(--blue)">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path>
        </svg>
      </div>
      <div class="min-w-0">
        <h1 class="display text-xl font-extrabold leading-none tracking-tight">ClubWatch</h1>
        <p class="mt-0.5 text-xs" style="color:var(--muted)">UCLA student organizations</p>
      </div>

      <button id="themeBtn" class="ml-auto grid h-9 w-9 place-items-center rounded-lg border"
              style="border-color:var(--line)" aria-label="Switch to dark mode" title="Switch theme">
        <svg id="iconSun" viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path>
        </svg>
        <svg id="iconMoon" viewBox="0 0 24 24" class="hidden h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"></path>
        </svg>
      </button>
    </div>

    <!-- Search -->
    <div class="relative pb-3">
      <svg viewBox="0 0 24 24" class="pointer-events-none absolute left-3 top-3 h-4 w-4" style="color:var(--muted)"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path>
      </svg>
      <input id="q" type="search" autocomplete="off" placeholder="Search clubs, or try “dance”, “pre-med”, “rocket”"
             class="w-full rounded-xl py-2.5 pl-9 pr-9 text-sm outline-none" aria-label="Search clubs">
      <button id="clearQ" class="absolute right-2 top-2 hidden h-6 w-6 place-items-center rounded-md"
              style="color:var(--muted)" aria-label="Clear search">✕</button>
    </div>

    <!-- Filters -->
    <div class="noscroll flex items-center gap-2 overflow-x-auto pb-3">
      <select id="fCat"  class="shrink-0 rounded-lg px-2.5 py-1.5 text-xs outline-none" aria-label="Filter by category"></select>
      <select id="fType" class="shrink-0 rounded-lg px-2.5 py-1.5 text-xs outline-none" aria-label="Filter by who can join">
        <option value="all">Anyone</option>
        <option value="ug">Open to undergraduates</option>
        <option value="gr">Open to graduates</option>
        <option value="sf">Staff and faculty</option>
      </select>
      <select id="fSort" class="shrink-0 rounded-lg px-2.5 py-1.5 text-xs outline-none" aria-label="Sort order">
        <option value="az">A to Z</option>
        <option value="za">Z to A</option>
      </select>
      <button id="resetBtn" class="hidden shrink-0 rounded-lg px-2.5 py-1.5 text-xs font-medium"
              style="color:var(--blue)">Reset filters</button>
    </div>

    <!-- Tabs -->
    <div class="flex items-center gap-1 border-b-0" role="tablist">
      <button id="tabAll" role="tab" aria-selected="true"
              class="relative -mb-px px-3 pb-2 pt-1 text-sm font-semibold">All clubs</button>
      <button id="tabFav" role="tab" aria-selected="false"
              class="relative -mb-px px-3 pb-2 pt-1 text-sm font-semibold">
        Favorites <span id="favCount" class="ml-1 rounded-full px-1.5 py-0.5 text-[11px] chip">0</span>
      </button>
      <button id="tabLive" role="tab" aria-selected="false"
              class="relative -mb-px px-3 pb-2 pt-1 text-sm font-semibold">Live Meetings</button>
      <button id="addMeetingBtn" class="ml-auto hidden shrink-0 rounded-lg px-2.5 py-1 text-xs font-semibold text-white"
              style="background:var(--blue)">+ Add meeting</button>
    </div>

    <!-- Live Meetings sub-filter: today / this week / this month. Only shown
         on that tab; the category/type/sort row above still applies since a
         meeting also belongs to a club and its category. -->
    <div id="liveFilterRow" class="hidden gap-1.5 pb-3">
      <button data-w="today" class="js-livewin rounded-lg px-2.5 py-1 text-xs font-medium">Today</button>
      <button data-w="week"  class="js-livewin rounded-lg px-2.5 py-1 text-xs font-medium">This week</button>
      <button data-w="month" class="js-livewin rounded-lg px-2.5 py-1 text-xs font-medium">This month</button>
    </div>
  </div>
</header>

<!-- ===================== Claim / schedule modal ===================== -->
<div id="modalBackdrop" class="modal-backdrop fixed inset-0 z-40 hidden items-center justify-center p-4">
  <div class="modal-card max-h-[85vh] w-full max-w-2xl overflow-y-auto rounded-2xl p-5">
    <div class="flex items-center justify-between">
      <h2 id="modalTitle" class="display text-lg font-bold">Add a meeting</h2>
      <button id="modalClose" class="grid h-7 w-7 place-items-center rounded-md" style="color:var(--muted)">✕</button>
    </div>
    <div id="modalBody" class="mt-3"></div>
  </div>
</div>

<!-- ===================== Body ===================== -->
<main class="mx-auto max-w-5xl px-4 sm:px-6">
  <div class="flex gap-4">

    <div class="min-w-0 flex-1">
      <p id="count" class="py-3 text-xs" style="color:var(--muted)"></p>
      <div id="list" role="list"></div>
      <div id="empty" class="hidden py-16 text-center">
        <p id="emptyTitle" class="display text-lg font-bold"></p>
        <p id="emptyBody" class="mx-auto mt-1 max-w-sm text-sm" style="color:var(--muted)"></p>
      </div>
    </div>

    <!-- A to Z rail: desktop only. Jumps to a letter heading. -->
    <nav id="rail" class="rail sticky top-52 hidden h-fit shrink-0 flex-col items-center py-3 lg:flex"
         aria-label="Jump to letter"></nav>
  </div>

  <footer class="border-t py-8 text-center text-xs" style="border-color:var(--line); color:var(--muted)">
    <p>Club data from UCLA Student Organizations, Leadership &amp; Engagement.</p>
    <p class="mt-1">ClubWatch is a student project and is not affiliated with UCLA.</p>
  </footer>
</main>

/* ---------------------------------------------------------------------
   Persistence.
   Two very different hosts have to work: the Claude artifact sandbox,
   which exposes window.storage, and a plain file opened from disk, which
   does not. We try the sandbox first and fall back to localStorage, with
   an in-memory last resort so a blocked or full store can never throw
   and break the page.
   --------------------------------------------------------------------- */
const Store = (() => {
  const sandbox = typeof window.storage?.get === 'function';
  const memory = {};
  return {
    async get(key, fallback) {
      if (sandbox) {
        try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; }
        catch { return fallback; }
      }
      try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
      catch { return key in memory ? memory[key] : fallback; }
    },
    async set(key, value) {
      memory[key] = value;
      if (sandbox) { try { await window.storage.set(key, JSON.stringify(value)); } catch {} return; }
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }
  };
})();

const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* A PIN only deters a casual stranger from editing a club's schedule; it
   is not real authentication, since anyone can read this file's source.
   Hashing it is still worth doing for free: it means a leaked database
   export doesn't hand out plain-text PINs. */
async function hashPin(pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pin.trim()));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

const liveState = {
  events: [],          // mirrors the Firestore "events" collection, kept live via onSnapshot
  window: 'week',       // today | week | month — how far ahead Live Meetings looks
  unlockedClub: null    // { id, name } once the correct PIN has been entered this session
};

/* Given an event's recurrence rule and the current moment, find its next
   real start/end as Date objects. Returns null for a one-off event whose
   time has already fully passed, since those have nothing left to show. */
function nextOccurrence(ev, now) {
  const [sh, sm] = ev.start.split(':').map(Number);
  const [eh, em] = ev.end.split(':').map(Number);

  if (ev.recurring) {
    const d = new Date(now);
    d.setDate(d.getDate() + ((ev.dow - d.getDay() + 7) % 7));
    d.setHours(sh, sm, 0, 0);
    const end = new Date(d); end.setHours(eh, em, 0, 0);
    if (end < now) { d.setDate(d.getDate() + 7); end.setDate(end.getDate() + 7); }
    return { start: d, end };
  }
  const [y, mo, da] = ev.date.split('-').map(Number);
  const start = new Date(y, mo - 1, da, sh, sm);
  const end   = new Date(y, mo - 1, da, eh, em);
  return end < now ? null : { start, end };
}

function eventStatus(ev, now) {
  const occ = nextOccurrence(ev, now);
  if (!occ) return null;
  return { kind: (now >= occ.start && now <= occ.end) ? 'live' : 'upcoming', ...occ };
}

function humanWhen(d, now) {
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return `Today, ${time}`;
  const tmr = new Date(now); tmr.setDate(tmr.getDate() + 1);
  if (d.toDateString() === tmr.toDateString()) return `Tomorrow, ${time}`;
  return `${DOW[d.getDay()]} ${d.getMonth() + 1}/${d.getDate()}, ${time}`;
}

/* ---------- render: Live Meetings tab ---------- */
function renderLive() {
  const now = new Date();
  const q = state.q.trim().toLowerCase();
  const horizonDays = { today: 1, week: 7, month: 31 }[liveState.window];
  const cutoff = new Date(now.getTime() + horizonDays * 86400000);

  let rows = liveState.events
    .map(ev => ({ ev, st: eventStatus(ev, now) }))
    .filter(r => r.st && r.st.start <= cutoff)
    .filter(r => !q || (r.ev.clubName + ' ' + r.ev.title).toLowerCase().includes(q));

  rows.sort((a, b) => (a.st.kind === 'live' ? 0 : 1) - (b.st.kind === 'live' ? 0 : 1) || a.st.start - b.st.start);

  el('count').textContent = FIREBASE_READY
    ? `${rows.length} meeting${rows.length === 1 ? '' : 's'}`
    : '';
  el('favCount').textContent = state.favorites.size;

  if (!rows.length) {
    el('list').innerHTML = ''; el('rail').innerHTML = '';
    el('empty').classList.remove('hidden');
    if (!FIREBASE_READY) {
      el('emptyTitle').textContent = "Live Meetings isn't available";
      el('emptyBody').textContent  = 'The rest of ClubWatch works normally. Reason: ' + firebaseError + '.';
    } else {
      el('emptyTitle').textContent = 'No meetings in this window';
      el('emptyBody').textContent  = 'Try This month, or check back closer to meeting time. Officers can add one with the button above.';
    }
    return;
  }
  el('empty').classList.add('hidden');

  el('list').innerHTML = rows.map(({ ev, st }) => `
    <div class="card px-1 py-3" role="listitem">
      <div class="flex items-center gap-2.5">
        ${st.kind === 'live'
          ? `<span class="live-dot flex shrink-0 items-center gap-1 rounded-full px-2 py-0.5 text-[10px] font-bold text-white"><i>●</i> LIVE</span>`
          : `<span class="chip shrink-0 rounded-full px-2 py-0.5 text-[10px] font-semibold">${esc(humanWhen(st.start, now))}</span>`}
        <span class="min-w-0 flex-1">
          <span class="block truncate text-[15px] font-semibold leading-snug">${esc(ev.clubName)}</span>
          <span class="block truncate text-xs" style="color:var(--muted)">${esc(ev.title)}${ev.location ? ' · ' + esc(ev.location) : ''}</span>
        </span>
      </div>
    </div>`).join('');
  el('rail').innerHTML = '';
}

/* ---------- Firestore wiring ---------- */
function startLiveSync() {
  if (!FIREBASE_READY) { renderLive(); return; }
  db.collection('events').onSnapshot(snap => {
    liveState.events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.tab === 'live') renderLive();
  }, err => console.warn('Firestore events listener failed:', err.message));
}
/* Recompute status every 30s so a meeting flips from Upcoming to Live, or
   drops off at its end time, without waiting on a new database write. */
setInterval(() => { if (state.tab === 'live') renderLive(); }, 30000);

           class="w-full rounded-lg px-3 py-2 text-sm outline-none" autocomplete="off">
    <div id="mResults" class="mt-2 max-h-64 overflow-y-auto"></div>
  `);
  const results = el('mResults');
  const draw = q => {
    q = q.trim().toLowerCase();
    const rows = q ? DATA.orgs.filter(o => o[1].toLowerCase().includes(q)).slice(0, 30) : [];
    results.innerHTML = rows.map(o =>
      `<button class="js-pick block w-full rounded-lg px-2.5 py-2 text-left text-sm hover:opacity-80"
               style="background:var(--sunk)" data-id="${o[0]}" data-name="${esc(o[1])}">${esc(o[1])}</button>`
    ).join('') || (q ? `<p class="px-1 py-2 text-xs" style="color:var(--muted)">No clubs match.</p>` : '');
  };
  el('mSearch').addEventListener('input', e => draw(e.target.value));
  results.addEventListener('click', e => {
    const b = e.target.closest('.js-pick');
    if (b) modalStepClaim(b.dataset.id, b.dataset.name);
  });
  el('mSearch').focus();
}

async function modalStepClaim(clubId, clubName) {
  showModal(clubName, `<p class="text-sm" style="color:var(--muted)">Checking…</p>`);
  let claimed = null;
  try { const snap = await db.collection('claims').doc(clubId).get(); if (snap.exists) claimed = snap.data(); }
  catch (e) { showModal(clubName, `<p class="text-sm text-red-500">Couldn't reach the database: ${esc(e.message)}</p>`); return; }

  if (claimed) {
    showModal(clubName, `
      <p class="mb-3 text-sm" style="color:var(--muted)">This club is already claimed. Enter its password to manage its schedule.</p>
      <input id="mPin" type="password" placeholder="Password"
             class="w-full rounded-lg px-3 py-2 text-sm outline-none" autocomplete="off">
      <p id="mErr" class="mt-1.5 hidden text-xs text-red-500">Incorrect password.</p>
      <button id="mUnlock" class="mt-3 w-full rounded-lg py-2 text-sm font-semibold text-white" style="background:var(--blue)">Unlock</button>
    `);
    el('mUnlock').addEventListener('click', async () => {
      const hash = await hashPin(el('mPin').value);
      if (hash === claimed.pinHash) { liveState.unlockedClub = { id: clubId, name: clubName }; modalStepSchedule(clubId, clubName); }
      else el('mErr').classList.remove('hidden');
    });
  } else {
    showModal(clubName, `
      <p class="mb-3 text-sm" style="color:var(--muted)">Nobody has claimed this club yet. Set a password so only your officers can edit its schedule later. Anyone who knows it can edit — pick something not easily guessed, and share it only with your officers.</p>
      <input id="mPin1" type="password" placeholder="Choose a password (6+ characters)"
             class="mb-2 w-full rounded-lg px-3 py-2 text-sm outline-none" autocomplete="off">
      <input id="mPin2" type="password" placeholder="Confirm password"
             class="w-full rounded-lg px-3 py-2 text-sm outline-none" autocomplete="off">
      <p id="mErr" class="mt-1.5 hidden text-xs text-red-500"></p>
      <button id="mClaim" class="mt-3 w-full rounded-lg py-2 text-sm font-semibold text-white" style="background:var(--blue)">Claim this club</button>
    `);
    el('mClaim').addEventListener('click', async () => {
      const p1 = el('mPin1').value, p2 = el('mPin2').value, err = el('mErr');
      if (p1.length < 6) { err.textContent = 'Password needs to be at least 6 characters.'; err.classList.remove('hidden'); return; }
      if (p1 !== p2) { err.textContent = "Passwords don't match."; err.classList.remove('hidden'); return; }
      try {
        await db.collection('claims').doc(clubId).set({ clubName, pinHash: await hashPin(p1) });
        liveState.unlockedClub = { id: clubId, name: clubName };
        modalStepSchedule(clubId, clubName);
      } catch (e) { err.textContent = "Couldn't save: " + e.message; err.classList.remove('hidden'); }
    });
  }
}

async function modalStepSchedule(clubId, clubName) {
  showModal(clubName, `
    <p class="mb-2 text-xs" style="color:var(--muted)">Weekly meetings, laid out like a calendar. Tap + on any day to add one.</p>
    <div id="mGrid" class="weekgrid"></div>
    <div class="mt-4 flex items-center justify-between">
      <h3 class="text-xs font-semibold">One-time events</h3>
      <button id="mAddOnce" class="text-xs font-semibold" style="color:var(--blue)">+ Add one-time event</button>
    </div>
    <div id="mOnce" class="mt-1.5 space-y-1.5"></div>
    <div id="mForm" class="mt-3"></div>
  `);
  await refreshScheduleList(clubId, clubName);
  el('mAddOnce').addEventListener('click', () => renderEventForm(clubId, clubName, false));
}

/* Recurring meetings render as a 7-column week, the familiar calendar shape
   requested; a one-time event is tied to a specific date rather than a
   weekday, so it doesn't fit that grid and gets its own list underneath. */
async function refreshScheduleList(clubId, clubName) {
  const grid = el('mGrid'), once = el('mOnce');
  if (!grid) return;
  grid.innerHTML = DOW.map(() => `<div class="daycol rounded-lg p-1"><p class="text-xs" style="color:var(--muted)">…</p></div>`).join('');

  const snap = await db.collection('events').where('clubId', '==', clubId).get();
  const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const weekly = rows.filter(r => r.recurring), oneoff = rows.filter(r => !r.recurring);

  grid.innerHTML = DOW.map((label, dow) => `
    <div class="daycol flex flex-col rounded-lg p-1.5">
      <p class="mb-1 text-center text-[11px] font-bold" style="color:var(--muted)">${label}</p>
      <div class="flex-1 space-y-1">
        ${weekly.filter(r => r.dow === dow).map(r => `
          <button class="js-del evchip block w-full rounded-md px-1.5 py-1 text-left text-[10px] leading-tight"
                  data-id="${r.id}" title="Tap to delete">
            <strong class="block truncate">${esc(r.title)}</strong>${esc(r.start)}–${esc(r.end)}
          </button>`).join('')}
      </div>
      <button class="js-addday mt-1 rounded-md py-1 text-[13px] font-bold" style="background:var(--paper)" data-dow="${dow}">+</button>
    </div>`).join('');

  once.innerHTML = oneoff.length ? oneoff.map(r => `
    <div class="flex items-center justify-between rounded-lg px-2.5 py-2 text-sm evchip oneoff">
      <span class="min-w-0 truncate"><strong>${esc(r.date)}</strong> ${esc(r.start)}–${esc(r.end)} · ${esc(r.title)}</span>
      <button class="js-del shrink-0 pl-2 text-xs font-semibold" data-id="${r.id}">Delete</button>
    </div>`).join('') : `<p class="text-xs" style="color:var(--muted)">None posted yet.</p>`;

  [grid, once].forEach(box => {
    box.querySelectorAll('.js-del').forEach(b => b.addEventListener('click', async e => {
      e.stopPropagation();
      await db.collection('events').doc(b.dataset.id).delete();
      refreshScheduleList(clubId, clubName);
    }));
  });
  grid.querySelectorAll('.js-addday').forEach(b =>
    b.addEventListener('click', () => renderEventForm(clubId, clubName, true, Number(b.dataset.dow))));
}

function renderEventForm(clubId, clubName, recurring, presetDow) {
  const box = el('mForm');
  box.innerHTML = `
    <div class="rounded-lg p-3" style="background:var(--sunk)">
      <input id="fTitle" placeholder="e.g. General meeting" class="mb-2 w-full rounded-md px-2.5 py-1.5 text-sm outline-none">
      ${recurring
        ? `<select id="fDow" class="mb-2 w-full rounded-md px-2.5 py-1.5 text-sm outline-none">
             ${DOW.map((d,i)=>`<option value="${i}" ${i===presetDow?'selected':''}>${d}</option>`).join('')}
           </select>`
        : `<input id="fDate" type="date" class="mb-2 w-full rounded-md px-2.5 py-1.5 text-sm outline-none">`}
      <div class="mb-2 flex gap-2">
        <input id="fStart" type="time" value="18:00" class="w-1/2 rounded-md px-2.5 py-1.5 text-sm outline-none">
        <input id="fEnd"   type="time" value="19:00" class="w-1/2 rounded-md px-2.5 py-1.5 text-sm outline-none">
      </div>
      <input id="fLoc" placeholder="Location (optional)" class="mb-2 w-full rounded-md px-2.5 py-1.5 text-sm outline-none">
      <button id="fSave" class="w-full rounded-md py-1.5 text-sm font-semibold text-white" style="background:var(--blue)">Save</button>
    </div>`;
  el('fTitle').focus();
  el('fSave').addEventListener('click', async () => {
    const title = el('fTitle').value.trim();
    if (!title) { el('fTitle').focus(); return; }
    const doc = { clubId, clubName, title, location: el('fLoc').value.trim(),
                  start: el('fStart').value, end: el('fEnd').value, recurring };
    if (recurring) doc.dow = Number(el('fDow').value); else doc.date = el('fDate').value;
    if (!recurring && !doc.date) { el('fDate').focus(); return; }
    await db.collection('events').add(doc);
    box.innerHTML = '';
    refreshScheduleList(clubId, clubName);
  });
}

function initAddMeetingFlow() {
  el('addMeetingBtn').addEventListener('click', () => {
    if (!FIREBASE_READY) {
      showModal('Not connected yet', `<p class="text-sm" style="color:var(--muted)">This copy of ClubWatch isn't linked to a database, so schedules can't be saved. Connect Firebase to enable this.</p>`);
      return;
    }
    modalStepPickClub();
  });
  el('modalClose').addEventListener('click', hideModal);
  el('modalBackdrop').addEventListener('click', e => { if (e.target.id === 'modalBackdrop') hideModal(); });
}

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* Sort key: strip anything that is not a letter or digit so
   "(Re)Defining Health" files under R, not under an invisible bracket. */
const sortKey = n => n.toLowerCase().replace(/^[^a-z0-9]+/, '');
const letterOf = n => { const c = sortKey(n)[0] || '#'; return /[a-z]/.test(c) ? c.toUpperCase() : '#'; };

/* Search haystack, built once per org and cached. Includes both category
   names so that typing "dance" finds clubs categorised under Dance even
   when the word is absent from the club's name. */
const haystack = new Map();
for (const o of DATA.orgs) {
  haystack.set(o[ID], [
    o[NAME],
    DATA.cats[o[CAT1]] || '',
    DATA.cats[o[CAT2]] || '',
    o[DESC] || ''
  ].join(' ').toLowerCase());
}

/* ---------------------------------------------------------------------
   getVisible(): the single source of truth for what is on screen.
   Pure. Reads state, returns an array. Never touches the DOM.
   --------------------------------------------------------------------- */
function getVisible() {
  const q = state.q.trim().toLowerCase();
  const openTo = OPEN_TO[state.type];

  let rows = DATA.orgs.filter(o => {
    if (state.tab === 'fav' && !state.favorites.has(o[ID])) return false;
    if (state.cat !== 'all' && String(o[CAT1]) !== state.cat && String(o[CAT2]) !== state.cat) return false;
    if (!openTo(o[MTYPE])) return false;
    if (q && !haystack.get(o[ID]).includes(q)) return false;
    return true;
  });

  /* DATA.orgs arrives pre-sorted A to Z from the build step, so A to Z is
     free and Z to A is one reversal. No comparator needed at runtime. */
  if (state.sort === 'za') rows = rows.slice().reverse();
  return rows;
}

/* ---------- row markup ---------- */
function rowHTML(o) {
  const fav = state.favorites.has(o[ID]);
  const open = state.expanded === o[ID];
  const cats = [DATA.cats[o[CAT1]], DATA.cats[o[CAT2]]].filter(Boolean);

  const chips = cats.map(c =>
    `<span class="chip rounded-md px-1.5 py-0.5 text-[11px] font-medium">${esc(c)}</span>`).join('');

  let detail = '';
  if (open) {
    const bits = [];
    if (o[DESC]) bits.push(`<p class="mb-2 text-[13px] leading-relaxed">${esc(o[DESC])}</p>`);
    bits.push(`<div class="flex gap-2"><span class="w-16 shrink-0 text-xs" style="color:var(--muted)">Open to</span>
               <span class="text-xs font-medium">${esc(TYPE_LABEL[o[MTYPE]] ?? 'Not stated')}</span></div>`);
    if (o[EMAIL]) bits.push(`<div class="flex gap-2"><span class="w-16 shrink-0 text-xs" style="color:var(--muted)">Email</span>
               <a class="break-all text-xs font-medium underline underline-offset-2" style="color:var(--blue)"
                  href="mailto:${esc(o[EMAIL])}">${esc(o[EMAIL])}</a></div>`);
    if (o[WEB]) bits.push(`<div class="flex gap-2"><span class="w-16 shrink-0 text-xs" style="color:var(--muted)">Website</span>
               <a class="break-all text-xs font-medium underline underline-offset-2" style="color:var(--blue)"
                  href="${esc(o[WEB])}" target="_blank" rel="noopener noreferrer">${esc(o[WEB])}</a></div>`);
    if (o[SOCIAL].length) bits.push(`<div class="flex gap-2"><span class="w-16 shrink-0 text-xs" style="color:var(--muted)">Social</span>
               <span class="flex flex-wrap gap-1.5">${o[SOCIAL].map(([l,u]) =>
                 `<a class="chip rounded-md px-2 py-0.5 text-[11px] font-medium underline-offset-2 hover:underline"
                     href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(l)}</a>`).join('')}</span></div>`);
    if (!o[EMAIL] && !o[WEB] && !o[SOCIAL].length)
      bits.push(`<p class="text-xs" style="color:var(--muted)">No contact details on file. Ask at the SOLE office in Kerckhoff 105.</p>`);
    detail = `<div class="mt-2.5 space-y-1.5 border-l-2 pl-3" style="border-color:var(--gold)">${bits.join('')}</div>`;
  }

  return `
  <div class="card px-1 py-3" role="listitem">
    <div class="flex items-start gap-2">
      <button class="js-fav star mt-0.5 shrink-0" data-id="${o[ID]}"
              aria-pressed="${fav}" aria-label="${fav ? 'Remove' : 'Add'} ${esc(o[NAME])} ${fav ? 'from' : 'to'} favorites">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="${fav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8">
          <path d="M12 3.6l2.6 5.3 5.8.85-4.2 4.1 1 5.75L12 16.9l-5.2 2.7 1-5.75-4.2-4.1 5.8-.85z" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="js-open min-w-0 flex-1 text-left" data-id="${o[ID]}" aria-expanded="${open}">
        <span class="block text-[15px] font-semibold leading-snug">${esc(o[NAME])}</span>
        <span class="mt-1 flex flex-wrap items-center gap-1">${chips}</span>
      </button>
      <svg viewBox="0 0 24 24" class="mt-1.5 h-4 w-4 shrink-0" style="color:var(--muted); transform:rotate(${open?180:0}deg)"
           fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    ${detail}
  </div>`;
}

/* ---------------------------------------------------------------------
   render(): state in, DOM out. Builds the whole list as one string and
   assigns it once, which is measurably faster than appending 1,600 nodes
   and keeps every code path identical.
   --------------------------------------------------------------------- */
const el = id => document.getElementById(id);

function render() {
  const rows = getVisible();

  el('count').textContent = state.tab === 'fav'
    ? `${rows.length} favorite${rows.length === 1 ? '' : 's'}`
    : `${rows.length.toLocaleString()} of ${DATA.orgs.length.toLocaleString()} clubs`;

  el('favCount').textContent = state.favorites.size;
  el('clearQ').style.display = state.q ? 'grid' : 'none';
  el('resetBtn').classList.toggle('hidden',
    state.cat === 'all' && state.type === 'all' && state.sort === 'az');

  /* Empty states name the cause and offer the way out. */
  if (!rows.length) {
    el('list').innerHTML = '';
    el('rail').innerHTML = '';
    el('empty').classList.remove('hidden');
    if (state.tab === 'fav' && !state.q && state.cat === 'all' && state.type === 'all') {
      el('emptyTitle').textContent = 'No favorites yet';
      el('emptyBody').textContent = 'Tap the star next to any club to keep it here.';
    } else {
      el('emptyTitle').textContent = 'Nothing matches';
      el('emptyBody').textContent = 'Try a shorter search word, or reset the filters.';
    }
    return;
  }
  el('empty').classList.add('hidden');

  /* Letter headings double as scroll targets for the rail. */
  const seen = [];
  let html = '', last = null;
  for (const o of rows) {
    const L = letterOf(o[NAME]);
    if (L !== last) {
      seen.push(L);
      html += `<h2 id="L-${L}" class="sticky-letter display sticky top-[188px] z-10 pb-1 pt-4 text-sm font-extrabold"
                   style="color:var(--deep)">${L}</h2>`;
      last = L;
    }
    html += rowHTML(o);
  }
  el('list').innerHTML = html;

  el('rail').innerHTML = seen.map(L =>
    `<button class="js-jump h-5 w-5 rounded text-[10px] font-semibold leading-5" data-l="${L}">${L}</button>`).join('');
}

/* ---------- category dropdown ----------
   60 flat options is unusable, so parents are derived by splitting UCLA's
   "Parent - Child" labels and children are nested under <optgroup>. */
function buildCategorySelect() {
  const groups = new Map();
  DATA.cats.forEach((name, i) => {
    const [parent, child] = name.split(' - ');
    if (!groups.has(parent)) groups.set(parent, []);
    groups.get(parent).push({ i, label: child || name, isParent: !child });
  });

  let html = '<option value="all">All categories</option>';
  for (const parent of [...groups.keys()].sort()) {
    const kids = groups.get(parent);
    if (kids.length === 1 && kids[0].isParent) {
      html += `<option value="${kids[0].i}">${esc(parent)}</option>`;
    } else {
      html += `<optgroup label="${esc(parent)}">` +
        kids.map(k => `<option value="${k.i}">${esc(k.isParent ? parent + ' (general)' : parent + ' — ' + k.label)}</option>`).join('') +
        '</optgroup>';
    }
  }
  el('fCat').innerHTML = html;
}

/* ---------- theme ---------- */
function applyTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  el('iconSun').classList.toggle('hidden', dark);
  el('iconMoon').classList.toggle('hidden', !dark);
  el('themeBtn').setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  Store.set('clubwatch:dark', dark);
}

/* ---------- tabs ---------- */
function applyTab(tab) {
  state.tab = tab;
  state.expanded = null;
  for (const [id, key] of [['tabAll','all'], ['tabFav','fav'], ['tabLive','live']]) {
    const on = key === tab;
    el(id).setAttribute('aria-selected', on);
    el(id).style.color = on ? 'var(--deep)' : 'var(--muted)';
    el(id).style.borderBottom = on ? '3px solid var(--gold)' : '3px solid transparent';
  }
  el('addMeetingBtn').classList.toggle('hidden', tab !== 'live');
  el('liveFilterRow').classList.toggle('hidden', tab !== 'live');
  el('liveFilterRow').classList.toggle('flex', tab === 'live');
  tab === 'live' ? renderLive() : render();
}

function setLiveWindow(w) {
  liveState.window = w;
  document.querySelectorAll('.js-livewin').forEach(b => {
    const on = b.dataset.w === w;
    b.style.background = on ? 'var(--blue)' : 'var(--sunk)';
    b.style.color = on ? '#fff' : 'var(--muted)';
  });
  renderLive();
}

/* ---------- events ----------
   One delegated listener on the list, so rebuilding innerHTML never
   orphans a handler. */
let debounce;
el('q').addEventListener('input', e => {
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    state.q = e.target.value; state.expanded = null;
    state.tab === 'live' ? renderLive() : render();
  }, 110);
});
el('clearQ').addEventListener('click', () => {
  el('q').value = ''; state.q = '';
  state.tab === 'live' ? renderLive() : render();
  el('q').focus();
});

el('fCat').addEventListener('change',  e => { state.cat  = e.target.value; state.expanded = null; render(); });
el('fType').addEventListener('change', e => { state.type = e.target.value; state.expanded = null; render(); });
el('fSort').addEventListener('change', e => { state.sort = e.target.value; render(); });

el('resetBtn').addEventListener('click', () => {
  state.cat = 'all'; state.type = 'all'; state.sort = 'az'; state.expanded = null;
  el('fCat').value = 'all'; el('fType').value = 'all'; el('fSort').value = 'az';
  render();
});

el('tabAll').addEventListener('click', () => applyTab('all'));
el('tabFav').addEventListener('click', () => applyTab('fav'));
el('tabLive').addEventListener('click', () => applyTab('live'));
document.querySelectorAll('.js-livewin').forEach(b => b.addEventListener('click', () => setLiveWindow(b.dataset.w)));
el('themeBtn').addEventListener('click', () => applyTheme(!document.documentElement.classList.contains('dark')));

el('list').addEventListener('click', e => {
  const fav = e.target.closest('.js-fav');
  if (fav) {
    const id = fav.dataset.id;
    state.favorites.has(id) ? state.favorites.delete(id) : state.favorites.add(id);
    Store.set('clubwatch:favorites', [...state.favorites]);
    render();
    return;
  }
  const open = e.target.closest('.js-open');
  if (open) {
    const id = open.dataset.id;
    state.expanded = state.expanded === id ? null : id;
    render();
  }
});

el('rail').addEventListener('click', e => {
  const b = e.target.closest('.js-jump');
  if (b) el('L-' + b.dataset.l)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* ---------- boot ----------
   Wrapped so that a failure in any one startup step (storage unavailable,
   a browser without crypto.subtle, anything unforeseen) still leaves a
   usable club directory rather than an empty white page. */
window.addEventListener('error', e => {
  const list = document.getElementById('list');
  if (list && !list.innerHTML.trim()) {
    document.getElementById('empty')?.classList.remove('hidden');
    const t = document.getElementById('emptyTitle'), b = document.getElementById('emptyBody');
    if (t) t.textContent = 'Something went wrong loading the page';
    if (b) b.textContent = e.message;
  }
});

(async () => {
  try {
    buildCategorySelect();
    const [dark, favs] = await Promise.all([
      Store.get('clubwatch:dark', window.matchMedia('(prefers-color-scheme: dark)').matches),
      Store.get('clubwatch:favorites', [])
    ]);
    applyTheme(!!dark);
    state.favorites = new Set(Array.isArray(favs) ? favs : []);
    setLiveWindow('week');
    startLiveSync();
    initAddMeetingFlow();
  } catch (e) {
    console.warn('Startup step failed, continuing with the directory:', e);
  }
  applyTab('all');   // always runs, so the club list draws no matter what
})();
</script>
</body>
</html>
